name: Admin Dashboard

on:
  push:
    branches: [main, develop]
    paths: ['apps/admin-dashboard/**', '.github/workflows/frontend/admin-dashboard.yml']
  pull_request:
    branches: [main, develop]
    paths: ['apps/admin-dashboard/**']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable/ci-frontend.yml
    with:
      app-name: admin-dashboard
      app-path: apps/admin-dashboard
      coverage-threshold: 85
    secrets: inherit

  security:
    name: Security
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      service-name: admin-dashboard
      service-path: apps/admin-dashboard
    secrets: inherit

  docker:
    name: Docker
    needs: [ci, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable/docker-build-push.yml
    with:
      service-name: admin-dashboard
      service-path: apps/admin-dashboard
      build-args: |
        VITE_API_URL=${{ vars.VITE_API_URL }}
    secrets: inherit

  deploy-development:
    name: Deploy → Development
    needs: docker
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: admin-dashboard
      ecs-service: admin-dashboard-service
      ecs-cluster: development-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: development
    secrets: inherit

  deploy-staging:
    name: Deploy → Staging
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: admin-dashboard
      ecs-service: admin-dashboard-service
      ecs-cluster: staging-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: staging
    secrets: inherit

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: admin-dashboard
      ecs-service: admin-dashboard-service
      ecs-cluster: production-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: production
    secrets: inherit
