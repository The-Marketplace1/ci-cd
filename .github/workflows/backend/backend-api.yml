name: Backend API

on:
  push:
    branches: [main, develop]
    paths: ['services/backend-api/**', '.github/workflows/backend/backend-api.yml']
  pull_request:
    branches: [main, develop]
    paths: ['services/backend-api/**']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable/ci-backend.yml
    with:
      service-name: backend-api
      service-path: services/backend-api
      with-postgres: true
      with-redis: true
    secrets: inherit

  security:
    name: Security
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      service-name: backend-api
      service-path: services/backend-api
    secrets: inherit

  docker:
    name: Docker
    needs: [ci, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable/docker-build-push.yml
    with:
      service-name: backend-api
      service-path: services/backend-api
    secrets: inherit

  deploy-development:
    name: Deploy → Development
    needs: docker
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: backend-api
      ecs-service: backend-api-service
      ecs-cluster: development-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: development
      run-migrations: true
    secrets: inherit

  deploy-staging:
    name: Deploy → Staging
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: backend-api
      ecs-service: backend-api-service
      ecs-cluster: staging-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: staging
      run-migrations: true
    secrets: inherit

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: backend-api
      ecs-service: backend-api-service
      ecs-cluster: production-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: production
      run-migrations: 
true
    secrets: inherit