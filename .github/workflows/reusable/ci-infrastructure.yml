name: Reusable — Infrastructure CI

on:
  workflow_call:
    inputs:
      tf-path:
        required: false
        type: string
        default: "terraform"
      k8s-path:
        required: false
        type: string
        default: "kubernetes"
      helm-path:
        required: false
        type: string
        default: "helm"
      terraform-version:
        required: false
        type: string
        default: "1.9.0"
    outputs:
      passed:
        value: ${{ jobs.gate.outputs.passed }}

jobs:
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ${{ inputs.tf-path }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Terraform init (backend-less)
        run: terraform -chdir=${{ inputs.tf-path }} init -backend=false
      - name: Terraform validate
        run: terraform -chdir=${{ inputs.tf-path }} validate

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-format, terraform-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Terraform plan (dry-run, no apply)
        run: |
          terraform -chdir=${{ inputs.tf-path }} init
          terraform -chdir=${{ inputs.tf-path }} plan -no-color -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ inputs.tf-path }}/tfplan
          retention-days: 3

  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: |
          find ${{ inputs.k8s-path }} -name "*.yaml" -o -name "*.yml" \
            | xargs kubeval --strict --ignore-missing-schemas

  helm-validate:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Helm lint all charts
        run: |
          for chart in $(find ${{ inputs.helm-path }} -name "Chart.yaml" -exec dirname {} \; | sort -u); do
            echo "Linting $chart..."
            helm lint "$chart"
          done
      - name: Helm template render
        run: |
          for chart in $(find ${{ inputs.helm-path }} -name "Chart.yaml" -exec dirname {} \; | sort -u); do
            echo "Template rendering $chart..."
            helm template release "$chart" > /dev/null
          done

  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [terraform-format, terraform-validate, terraform-plan, k8s-validate, helm-validate]
    if: always()
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✔ Infrastructure gate PASSED"
