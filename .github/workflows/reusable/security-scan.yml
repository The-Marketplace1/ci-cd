name: Reusable — Security Scan

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string
      image:
        required: false
        type: string
        default: ""
        description: "Full image URI to scan with Trivy (optional)"
      language:
        required: false
        type: string
        default: "javascript"
      run-codeql:
        required: false
        type: boolean
        default: true
      run-trivy:
        required: false
        type: boolean
        default: true
      run-secret-scan:
        required: false
        type: boolean
        default: true
      run-license-check:
        required: false
        type: boolean
        default: true
    outputs:
      passed:
        value: ${{ jobs.gate.outputs.passed }}

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: inputs.run-secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on filesystem (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service-path }}
          format: sarif
          output: trivy-dependency.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-dependency.sarif
          category: trivy-dependency-${{ inputs.service-name }}

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    if: inputs.run-trivy && inputs.image != ''
    steps:
      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ inputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ inputs.service-name }}

  sast-codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    if: inputs.run-codeql
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.language }}
          queries: security-and-quality
      - name: Auto-build for CodeQL
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ inputs.service-name }}

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    if: inputs.run-license-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g license-checker
      - name: Check licenses
        working-directory: ${{ inputs.service-path }}
        run: |
          license-checker \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;0BSD;Unlicense;Python-2.0" \
            --excludePrivatePackages \
            --json > license-report.json
          echo "✔ All licenses comply with policy"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service-name }}-license-report
          path: ${{ inputs.service-path }}/license-report.json
          retention-days: 30

  gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, container-scan, sast-codeql, license-check]
    if: always()
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Security gate FAILED"
            exit 1
          fi
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✔ Security gate PASSED"
