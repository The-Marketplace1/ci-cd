name: Reusable — Backend CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Canonical service name (e.g. auth-service)"
      service-path:
        required: true
        type: string
        description: "Relative path to the service directory (e.g. services/auth-service)"
      node-version:
        required: false
        type: string
        default: "20"
      pnpm-version:
        required: false
        type: string
        default: "9"
      with-postgres:
        required: false
        type: boolean
        default: false
      with-redis:
        required: false
        type: boolean
        default: false
      coverage-threshold:
        required: false
        type: number
        default: 80
      docker-build-validate:
        required: false
        type: boolean
        default: true
    outputs:
      passed:
        description: "true if every job in this pipeline succeeded"
        value: ${{ jobs.gate.outputs.passed }}

jobs:
  # ── Install & cache ────────────────────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.service-path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.service-path }}

  # ── Linting & formatting ───────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.service-path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.service-path }}
      - run: pnpm run lint
        working-directory: ${{ inputs.service-path }}
      - run: pnpm run format:check
        working-directory: ${{ inputs.service-path }}

  # ── TypeScript type checking ───────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.service-path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.service-path }}
      - run: pnpm run typecheck
        working-directory: ${{ inputs.service-path }}

  # ── Unit + integration tests ───────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install

    services:
      postgres:
        image: ${{ inputs.with-postgres && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: ${{ inputs.service-name }}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ inputs.with-redis && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.service-path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.service-path }}
      - name: Run tests with coverage
        run: pnpm run test:coverage
        working-directory: ${{ inputs.service-path }}
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ inputs.with-postgres && format('postgresql://testuser:testpass@localhost:5432/{0}_test', inputs.service-name) || '' }}
          REDIS_URL: ${{ inputs.with-redis && 'redis://localhost:6379' || '' }}
      - name: Check coverage threshold
        run: |
          THRESHOLD=${{ inputs.coverage-threshold }}
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Coverage: $COVERAGE% (threshold: $THRESHOLD%)"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below required $THRESHOLD%"
            exit 1
          fi
          echo "✔ Coverage check passed"
        working-directory: ${{ inputs.service-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service-name }}-coverage
          path: ${{ inputs.service-path }}/coverage/
          retention-days: 14

  # ── Build verification ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.service-path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.service-path }}
      - run: pnpm run build
        working-directory: ${{ inputs.service-path }}

  # ── Dependency audit ───────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - run: pnpm audit --audit-level=high
        working-directory: ${{ inputs.service-path }}

  # ── Docker build validation ────────────────────────────────────────────────
  docker-validate:
    name: Docker Build Validate
    runs-on: ubuntu-latest
    if: inputs.docker-build-validate
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker build (no push)
        run: |
          docker build \
            --file ${{ inputs.service-path }}/Dockerfile \
            --tag ${{ inputs.service-name }}:ci-validate \
            --target builder \
            ${{ inputs.service-path }}

  # ── Quality gate ───────────────────────────────────────────────────────────
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, dependency-audit, docker-validate]
    if: always()
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Quality gate FAILED"
            exit 1
          fi
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✔ Quality gate PASSED"
