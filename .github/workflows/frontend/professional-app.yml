name: Professional App

on:
  push:
    branches: [main, develop]
    paths: ['apps/professional-app/**', '.github/workflows/frontend/professional-app.yml']
  pull_request:
    branches: [main, develop]
    paths: ['apps/professional-app/**']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable/ci-frontend.yml
    with:
      app-name: professional-app
      app-path: apps/professional-app
      run-e2e: ${{ github.ref == 'refs/heads/main' }}
      e2e-base-url: ${{ vars.STAGING_PRO_URL }}
    secrets: inherit

  security:
    name: Security
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      service-name: professional-app
      service-path: apps/professional-app
    secrets: inherit

  docker:
    name: Docker
    needs: [ci, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable/docker-build-push.yml
    with:
      service-name: professional-app
      service-path: apps/professional-app
      build-args: |
        VITE_API_URL=${{ vars.VITE_API_URL }}
    secrets: inherit

  deploy-development:
    name: Deploy → Development
    needs: docker
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: professional-app
      ecs-service: professional-app-service
      ecs-cluster: development-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: development
    secrets: inherit

  deploy-staging:
    name: Deploy → Staging
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: professional-app
      ecs-service: professional-app-service
      ecs-cluster: staging-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: staging
    secrets: inherit

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable/cd-deploy.yml
    with:
      service-name: professional-app
      ecs-service: professional-app-service
      ecs-cluster: production-cluster
      image: ${{ needs.docker.outputs.image }}
      environment: production
    secrets: inherit
